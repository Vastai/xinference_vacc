services:
  Qwen3-30B-A3B-GPTQ-tp4-text2vec-xinference:
    image: ${IMAGE}
    container_name: Qwen3-30B-A3B-GPTQ-Int4-tp4-text2vec-xinference
    restart: unless-stopped  # 更智能的重启策略
    shm_size: 256g
    privileged: true
    ports:
      - "${service_port}:${service_port}"
    cap_add:
      - SYS_NICE
    environment:
      - model_name=${model_name}
      - model_directory=${model_directory}
      - embedding_model_name=${embedding_model_name}
      - embedding_model_directory=${embedding_model_directory}
      - embedding_GPUs=${embedding_GPUs}
      - embedding_instance_nums=${embedding_instance_nums}
      - embedding_tp=${embedding_tp}
      - rerank_model_name=${rerank_model_name}
      - rerank_model_directory=${rerank_model_directory}
      - rerank_GPUs=${rerank_GPUs}
      - rerank_instance_nums=${rerank_instance_nums}
      - rerank_tp=${rerank_tp}
      - VLLM_ENGINE_ITERATION_TIMEOUT_S=864000 # vLLM引擎超时(24小时)
      - XINFERENCE_SSE_PING_ATTEMPTS_SECONDS=864000
      - VLLM_NO_USAGE_TIMEOUT=0               # 禁用无请求超时
      - VLLM_NO_USAGE_STATS=1
       # 显存优化（防止单实例OOM）
      - VLLM_LOGGING_LEVEL=DEBUG             
      - GPU_LIST=${GPU_LIST}                     # 用到的GPU 列表 4= tp2 *instance_nums
      - instance_nums=${instance_nums}
      - XOSCAR_CPU_AFFINITY=1
      - XINFERENCE_RERANK_EMPTY_CACHE_COUNT=200
      - XINFERENCE_EMBEDDING_EMPTY_CACHE_COUNT=200
      - XINFERENCE_EMBEDDING_EMPTY_CACHE_TOKENS=81920
    volumes:
      - ${LLM_DATA_DIR}:/weights
      - ${EMB_DATA_DIR}:/embedding_weights
      - ${RERANK_DATA_DIR}:/rerank_weights
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://0.0.0.0:${service_port}/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    entrypoint:
      - /bin/bash
      - -c
      - |
        # 防止SIGTERM导致退出
        trap : TERM INT
        cd /test/qwen3/local

        echo "=================== start run supervisor ========================="
        xinference-local -H 0.0.0.0 -p ${service_port} &  
        until curl -s http://0.0.0.0:${service_port}/status; do
          sleep 5
        done

        # 启动模型服务
        if ! command -v xinference &> /dev/null; then
            echo "Error: xinference command not found. Please install Xinference first."
            exit 1
        fi

        # 启动两个模型副本，共享UID, 可以通过同一个UID去分发调度请求
        echo "==================== Launching Model Replica 1 ===================="

        echo '{
          "model_path": "/weights/'$${model_directory}'",
          "additional_params": {
            "tensor_parallel_size": 4,
            "max_model_len": 131072,
            "rope_scaling": {
              "rope_type": "yarn",
              "factor": 4.0,
              "original_max_position_embeddings": 32768
            },
            "enforce_eager": true
          }
        }' > register_qwen3.json

        python launch_qwen3_int4.py --url http://127.0.0.1:${service_port} --model-config register_qwen3.json --gpu_idx $$GPU_LIST --instance-nums $$instance_nums

        cd /test/emb-rerank

        # ===================== 新增条件判断逻辑 =====================
        # 根据 embedding_model_name 选择执行的脚本
        EMB_SCRIPT="launch_qwen3_emb.py"
        if [ $$embedding_model_name = "Qwen3-Embedding-0.6B" ]; then
            echo "==================== Launching Qwen3 Embedding ===================="
            echo "max model len 65536"
            EMB_SCRIPT="launch_qwen3_emb.py"
            echo '{
              "model_path": "/embedding_weights/'$${embedding_model_directory}'",
              "additional_params": {
                "tensor_parallel_size": ${embedding_tp},
                "max_model_len": 65536,
                "rope_scaling": {
                  "rope_type": "yarn",
                  "factor": 2.0,
                  "original_max_position_embeddings": 32768
                },
                "enforce_eager": true
              }
            }' > register_emb.json
        elif [ $$embedding_model_name = "bge-m3" ]; then
            echo "==================== Launching BGE-M3 Embedding ===================="
            echo "max model len 8192"
            EMB_SCRIPT="launch_bge_emb.py"
            echo '{
              "model_path": "/embedding_weights/'$${embedding_model_directory}'",
              "additional_params": {
                "tensor_parallel_size": ${embedding_tp},
                "max_model_len": 8192,
                "enforce_eager": true
              }
            }' > register_emb.json
        else
            echo "Error: Unsupported embedding_model_name - $embedding_model_name"
            echo "Supported values: Qwen3-Embedding-0.6B, bge-m3"
            exit 1
        fi
        
        python $$EMB_SCRIPT --url http://127.0.0.1:${service_port}  --model-config register_emb.json --instance-nums $$embedding_instance_nums --gpu_idx $$embedding_GPUs

          # 根据 rerank_model_name 选择执行的脚本
        RERANK_SCRIPT="launch_bge_rerank.py"
        if [ $$rerank_model_name = "Qwen3-Reranker-0.6B" ]; then
            echo "==================== Launching Qwen3 Reranker ===================="
            echo "max model len 40960"
            RERANK_SCRIPT="launch_qwen3_rerank.py"  # Qwen3 rerank 对应的脚本
            echo '{
              "model_path": "/rerank_weights/'$${rerank_model_directory}'",
              "additional_params": {
                "tensor_parallel_size": ${rerank_tp},
                "max_model_len": 40960,
                "enforce_eager": true
              }
            }' > register_rerank.json
        elif [ $$rerank_model_name = "bge-reranker-v2-m3" ]; then
            echo "==================== Launching BGE-Reranker-v2-m3 ===================="
            echo "max model len 8192"
            RERANK_SCRIPT="launch_bge_rerank.py"   # BGE rerank 对应的脚本
            echo '{
              "model_path": "/rerank_weights/'$${rerank_model_directory}'",
              "additional_params": {
                "tensor_parallel_size": ${rerank_tp},
                "max_model_len": 8192,
                "enforce_eager": true
              }
            }' > register_rerank.json
        else
            echo "Error: Unsupported rerank_model_name - $rerank_model_name"
            echo "Supported values: Qwen3-Reranker-0.6B, bge-reranker-v2-m3"
            exit 1
        fi
        python $$RERANK_SCRIPT --url http://127.0.0.1:${service_port} --model-config register_rerank.json --instance-nums $$rerank_instance_nums --gpu_idx $$rerank_GPUs

        # 输出汇总信息
        echo "=================================================================="
        echo "Supervisor: http://0.0.0.0:${service_port}"
        echo "=================================================================="
        echo "LLM Model Name: $$model_name"
        echo "=================================================================="
        echo "Embedding Model Name: $$embedding_model_name"
        echo "=================================================================="
        echo "Rerank Model Name: $$rerank_model_name"
        tail -f /dev/null 


        
